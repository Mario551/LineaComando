<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="blueHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#053d8f"/>
      <stop offset="1" stop-color="#0b63ce"/>
    </linearGradient>
    <linearGradient id="purpleHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5720b7"/>
      <stop offset="1" stop-color="#7d2ee6"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="softPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcf9ff"/>
      <stop offset="1" stop-color="#f4edff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#112244" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0b4fb3"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#6a2bd6"/>
    </marker>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1f2937"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 48px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #475569; }
      .section { fill: #ffffff; stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .sectionBlue { stroke: #2563eb; }
      .sectionPurple { stroke: #7c3aed; }
      .sectionNeutral { stroke: #64748b; }
      .headerText { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; }
      .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .boxBlue { fill: url(#softBlue); stroke: #2563eb; }
      .boxPurple { fill: url(#softPurple); stroke: #7c3aed; }
      .boxGreen { fill: #f0fdf4; stroke: #16a34a; }
      .boxOrange { fill: #fff7ed; stroke: #ea580c; }
      .boxRed { fill: #fff1f2; stroke: #e11d48; }
      .boxGray { fill: #f8fafc; stroke: #64748b; }
      .dashed { stroke-dasharray: 8 8; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 19px; font-weight: 800; fill: #0f172a; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #334155; }
      .tiny { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .note { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .notePurple { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #581c87; }
      .numCircle { fill: #0b4fb3; }
      .numCirclePurple { fill: #6a2bd6; }
      .num { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 900; fill: #ffffff; }
      .arrow { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrowDark); }
      .arrowBlueLine { stroke: #0b4fb3; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrowPurpleLine { stroke: #6a2bd6; stroke-width: 3; fill: none; marker-end: url(#arrowPurple); }
      .mutedLine { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .pill { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 16; }
      .pillPurple { fill: #faf5ff; stroke: #7c3aed; stroke-width: 1.5; rx: 16; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1200"/>

  <text class="title" x="900" y="58" text-anchor="middle">Arquitectura propuesta: mensajería, orquestador y contexto de IA</text>
  <text class="subtitle" x="900" y="92" text-anchor="middle">BD como fuente de verdad, cola en memoria para activación, contexto como límite lógico por conversación</text>

  <rect class="section sectionBlue" x="30" y="120" width="1740" height="290" rx="20"/>
  <rect x="505" y="98" width="790" height="46" rx="12" fill="url(#blueHeader)"/>
  <text class="headerText" x="900" y="129" text-anchor="middle">1) Entrada robusta: persistir, encolar en memoria y procesar eventos</text>

  <rect class="box boxBlue" x="60" y="190" width="215" height="110" rx="14"/>
  <text class="label" x="168" y="231" text-anchor="middle">Canales externos</text>
  <text class="small" x="168" y="260" text-anchor="middle">entrada / salida</text>

  <rect class="box boxBlue" x="315" y="178" width="260" height="135" rx="14"/>
  <text class="label" x="445" y="214" text-anchor="middle">Servicio de mensajería</text>
  <text class="small" x="445" y="244" text-anchor="middle">valida, registra eventos</text>
  <text class="small" x="445" y="269" text-anchor="middle">y envía mensajes</text>
  <text class="tiny" x="445" y="296" text-anchor="middle">recibe comandos del orquestador</text>

  <rect class="box boxGreen" x="635" y="178" width="250" height="135" rx="14"/>
  <text class="label" x="760" y="214" text-anchor="middle">BD mensajes/eventos</text>
  <text class="small" x="760" y="244" text-anchor="middle">fuente de verdad</text>
  <text class="small" x="760" y="269" text-anchor="middle">estados y resultados</text>
  <text class="tiny" x="760" y="296" text-anchor="middle">no activa el flujo normal</text>

  <rect class="box boxOrange" x="965" y="178" width="250" height="135" rx="14"/>
  <text class="label" x="1090" y="214" text-anchor="middle">Servicio cola eventos</text>
  <text class="small" x="1090" y="244" text-anchor="middle">cola en memoria</text>
  <text class="small" x="1090" y="269" text-anchor="middle">evento completo</text>
  <text class="tiny" x="1090" y="296" text-anchor="middle">no es persistencia</text>

  <rect class="box boxPurple" x="1295" y="178" width="230" height="135" rx="14"/>
  <text class="label" x="1410" y="214" text-anchor="middle">Orquestador</text>
  <text class="label" x="1410" y="240" text-anchor="middle">de contexto</text>
  <text class="small" x="1410" y="269" text-anchor="middle">consume eventos</text>
  <text class="tiny" x="1410" y="296" text-anchor="middle">sin escanear BD</text>

  <path class="arrow" d="M 275 245 L 305 245"/>
  <path class="arrow" d="M 315 285 L 285 285"/>
  <path class="arrow" d="M 575 260 L 625 260"/>
  <path class="arrowBlueLine" d="M 575 218 C 700 160, 840 160, 965 218"/>
  <text class="tiny" x="770" y="166" text-anchor="middle">si el registro fue correcto, encola evento completo</text>
  <path class="arrow" d="M 1215 245 L 1285 245"/>
  <path class="arrowPurpleLine dashed" d="M 1410 313 L 1410 326 L 445 326 L 445 323"/>
  <text class="notePurple" x="925" y="324" text-anchor="middle">Comando del orquestador: EnviarMensaje</text>
  <path class="arrowBlueLine dashed" d="M 1090 313 C 1035 385, 820 385, 760 323"/>
  <text class="note" x="930" y="390" text-anchor="middle">Solo al iniciar: la cola carga desde BD eventos pendientes/no procesados. No es polling operativo.</text>

  <rect class="pill" x="75" y="332" width="510" height="44" rx="18"/>
  <text class="note" x="330" y="360" text-anchor="middle">BD registra el hecho; la cola en memoria activa el procesamiento.</text>
  <rect class="pill" x="1190" y="332" width="500" height="44" rx="18"/>
  <text class="note" x="1440" y="360" text-anchor="middle">El orquestador recibe eventos; no busca pendientes por intervalo.</text>

  <rect class="section sectionBlue" x="30" y="450" width="820" height="630" rx="20"/>
  <rect x="205" y="428" width="470" height="46" rx="12" fill="url(#blueHeader)"/>
  <text class="headerText" x="440" y="459" text-anchor="middle">2) Resolución del orquestador</text>

  <rect class="box boxGray" x="70" y="510" width="720" height="70" rx="14"/>
  <circle class="numCircle" cx="107" cy="545" r="22"/>
  <text class="num" x="107" y="552" text-anchor="middle">1</text>
  <text class="label" x="145" y="537">Recibir evento desde cola en memoria</text>
  <text class="small" x="145" y="562">El evento ya fue registrado en BD por el servicio de mensajería.</text>

  <rect class="box boxGray" x="70" y="610" width="720" height="84" rx="14"/>
  <circle class="numCircle" cx="107" cy="652" r="22"/>
  <text class="num" x="107" y="659" text-anchor="middle">2</text>
  <text class="label" x="145" y="639">Resolver conversación</text>
  <text class="small" x="145" y="666">Clave: Source + Usuario + Sesión.</text>
  <text class="small" x="145" y="688">El orquestador puede manejar muchas conversaciones en paralelo.</text>

  <rect class="box boxGray" x="70" y="724" width="720" height="108" rx="14"/>
  <circle class="numCircle" cx="107" cy="778" r="22"/>
  <text class="num" x="107" y="785" text-anchor="middle">3</text>
  <text class="label" x="145" y="752">Resolver línea activa por fecha</text>
  <text class="small" x="145" y="780">Si FechaNuevoMensaje - FechaÚltimoMensaje &lt;= ventana configurable:</text>
  <text class="small" x="145" y="805">usar línea actual. Si no, crear nueva línea.</text>

  <rect class="box boxGray" x="70" y="862" width="720" height="84" rx="14"/>
  <circle class="numCircle" cx="107" cy="904" r="22"/>
  <text class="num" x="107" y="911" text-anchor="middle">4</text>
  <text class="label" x="145" y="891">Preparar paquete para el contexto</text>
  <text class="small" x="145" y="918">Evento actual + línea activa + metadatos del contexto.</text>
  <text class="small" x="145" y="940">El contenido de otras conversaciones no se entrega.</text>

  <rect class="box boxOrange" x="70" y="976" width="720" height="70" rx="14"/>
  <circle class="numCircle" cx="107" cy="1011" r="22"/>
  <text class="num" x="107" y="1018" text-anchor="middle">5</text>
  <text class="label" x="145" y="1004">Control de orden por línea</text>
  <text class="small" x="145" y="1029">Dentro de la misma línea, procesar secuencialmente para no alterar intención.</text>

  <path class="arrowBlueLine" d="M 430 580 L 430 600"/>
  <path class="arrowBlueLine" d="M 430 694 L 430 714"/>
  <path class="arrowBlueLine" d="M 430 832 L 430 852"/>
  <path class="arrowBlueLine" d="M 430 946 L 430 966"/>

  <rect class="section sectionPurple" x="890" y="450" width="880" height="630" rx="20"/>
  <rect x="1075" y="428" width="510" height="46" rx="12" fill="url(#purpleHeader)"/>
  <text class="headerText" x="1330" y="459" text-anchor="middle">3) Contexto aislado por conversación</text>

  <rect class="box boxPurple" x="930" y="510" width="275" height="130" rx="14"/>
  <text class="label" x="1068" y="544" text-anchor="middle">Metadatos del contexto</text>
  <text class="small" x="1068" y="575" text-anchor="middle">ContextoId</text>
  <text class="small" x="1068" y="600" text-anchor="middle">ConversacionId / Source</text>
  <text class="small" x="1068" y="625" text-anchor="middle">Usuario / Sesión / Línea actual</text>

  <rect class="box boxPurple" x="1260" y="510" width="230" height="130" rx="14"/>
  <text class="label" x="1375" y="544" text-anchor="middle">Memoria temporal</text>
  <text class="small" x="1375" y="575" text-anchor="middle">línea activa</text>
  <text class="small" x="1375" y="600" text-anchor="middle">estado operativo</text>
  <text class="tiny" x="1375" y="625" text-anchor="middle">sin persistencia</text>

  <rect class="box boxPurple" x="1535" y="510" width="195" height="130" rx="14"/>
  <text class="label" x="1633" y="544" text-anchor="middle">Herramientas</text>
  <text class="small" x="1633" y="575" text-anchor="middle">comandos</text>
  <text class="small" x="1633" y="600" text-anchor="middle">APIs / servicios</text>
  <text class="tiny" x="1633" y="625" text-anchor="middle">scope obligatorio</text>

  <rect class="box boxGray" x="930" y="690" width="170" height="95" rx="14"/>
  <text class="label" x="1015" y="724" text-anchor="middle">Filtros</text>
  <text class="small" x="1015" y="753" text-anchor="middle">cadena de</text>
  <text class="small" x="1015" y="775" text-anchor="middle">responsabilidad</text>

  <rect class="box boxGray" x="1140" y="690" width="180" height="95" rx="14"/>
  <text class="label" x="1230" y="724" text-anchor="middle">IA intención</text>
  <text class="small" x="1230" y="753" text-anchor="middle">analiza línea</text>
  <text class="small" x="1230" y="775" text-anchor="middle">activa completa</text>

  <rect class="box boxGray" x="1360" y="690" width="180" height="95" rx="14"/>
  <text class="label" x="1450" y="724" text-anchor="middle">Decisión</text>
  <text class="small" x="1450" y="753" text-anchor="middle">tarea / servicio</text>
  <text class="small" x="1450" y="775" text-anchor="middle">según intención</text>

  <rect class="box boxGray" x="1580" y="690" width="150" height="95" rx="14"/>
  <text class="label" x="1655" y="724" text-anchor="middle">Ejecución</text>
  <text class="small" x="1655" y="753" text-anchor="middle">comando</text>
  <text class="small" x="1655" y="775" text-anchor="middle">limitado</text>

  <path class="arrowPurpleLine" d="M 1100 738 L 1130 738"/>
  <path class="arrowPurpleLine" d="M 1320 738 L 1350 738"/>
  <path class="arrowPurpleLine" d="M 1540 738 L 1570 738"/>

  <rect class="box boxGreen" x="930" y="835" width="375" height="115" rx="14"/>
  <text class="label" x="1118" y="869" text-anchor="middle">Solicitud de historial anterior</text>
  <text class="small" x="1118" y="900" text-anchor="middle">La IA puede pedir contexto pasado,</text>
  <text class="small" x="1118" y="925" text-anchor="middle">pero solo de la misma conversación.</text>

  <rect class="box boxRed" x="1345" y="835" width="385" height="115" rx="14"/>
  <text class="label" x="1538" y="869" text-anchor="middle">Prohibición estructural</text>
  <text class="small" x="1538" y="900" text-anchor="middle">La IA no elige ConversacionId,</text>
  <text class="small" x="1538" y="925" text-anchor="middle">UsuarioId, Source ni Sesión.</text>

  <path class="arrowPurpleLine dashed" d="M 1230 785 C 1230 825, 1160 815, 1140 835"/>
  <path class="arrowPurpleLine dashed" d="M 1305 892 L 1335 892"/>
  <path class="arrowPurpleLine dashed" d="M 1538 835 C 1515 810, 1600 805, 1655 785"/>

  <rect class="pillPurple" x="930" y="980" width="800" height="62" rx="18"/>
  <text class="notePurple" x="1330" y="1006" text-anchor="middle">Todo comando recibe metadatos del contexto y valida alcance antes de consultar datos.</text>
  <text class="notePurple" x="1330" y="1031" text-anchor="middle">Resultado permitido: conversación actual, línea activa y líneas anteriores autorizadas.</text>

  <path class="arrowPurpleLine dashed" d="M 850 904 C 875 904, 875 738, 920 738"/>

  <rect class="section sectionNeutral" x="30" y="1110" width="1740" height="65" rx="18"/>
  <text class="label" x="70" y="1149">Reglas clave:</text>
  <text class="small" x="215" y="1149">BD = fuente de verdad</text>
  <text class="small" x="445" y="1149">Cola memoria = activación</text>
  <text class="small" x="720" y="1149">Orquestador no escanea BD</text>
  <text class="small" x="1035" y="1149">Historial solo dentro de la conversación</text>
  <text class="small" x="1435" y="1149">Comandos con metadatos del contexto</text>

</svg>
